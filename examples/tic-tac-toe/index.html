<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boreDOM tic-tac-toe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    game-board { display: grid; grid-template-columns: repeat(3, 4rem); gap: .25rem; }
    game-button button { width: 4rem; height: 4rem; font-size: 2rem; }
    game-turn { display: block; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Tic-tac-toe</h1>
  <p>
    <code>game-button</code> has no logic. Its <code>play</code> action bubbles up to
    <code>game-board</code>, which owns the rules. <code>game-turn</code> only reads state.
  </p>

  <game-turn></game-turn>
  <game-board></game-board>

  <template data-component="game-button">
    <button data-dispatch="play"></button>
  </template>

  <template data-component="game-board" data-src="./game-board.js">
    <game-button></game-button><game-button></game-button><game-button></game-button>
    <game-button></game-button><game-button></game-button><game-button></game-button>
    <game-button></game-button><game-button></game-button><game-button></game-button>
  </template>

  <template data-component="game-turn" data-src="./game-turn.js">
    <p data-ref="label"></p>
    <button data-dispatch="reset">Reset</button>
  </template>

  <script type="module">
    import { mount } from "../../dist/boredom.js";

    mount({ board: Array(9).fill(null), next: "O", winner: null });
  </script>
</body>
</html>
